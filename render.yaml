
services:
  - type: web
    name: ChatOnline
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: chatroom-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: SESSION_SECRET
        generateValue: true
      - key: TENOR_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: DEV_USERNAMES
        sync: false
